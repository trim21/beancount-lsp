name: autofix.ci

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: trim21/setup-rust@v0.0.1

      - run: uv tool run prek -- run -a || true
      - run: cargo fmt || true
      - run: cargo clippy --fix --allow-dirty || true
      - run: cargo fmt || true

      - uses: autofix-ci/action@v1
