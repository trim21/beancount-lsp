name: rust tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-15
          - windows-latest
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: trim21/setup-rust@v0.0.2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The ledger checker only runs when a Python with beancount is reachable, and the
      # diagnostics tests skip without it. uv sync creates `.venv` at the repo root, where the
      # server looks for it relative to its working directory.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          activate-environment: true
          enable-cache: true

      - name: Install beancount for checker tests
        run: uv sync --frozen

      - name: Test (cargo test)
        run: cargo nextest run -p beancount-lsp

  cargo-test:
    runs-on: ubuntu-slim
    needs:
      - rust
    steps:
      - run: echo 1
