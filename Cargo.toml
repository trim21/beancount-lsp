[workspace]
resolver = "3"
members = ["crates/lsp", "crates/lsp-py"]
package.version = "0.0.0"

[workspace.dependencies]
beancount-core = { git = "https://github.com/trim21/beancount.git", rev = "806ba9b3f77d8c5d0b2d17e0c9b28d8346f6beff" }
beancount-parser = { git = "https://github.com/trim21/beancount.git", rev = "806ba9b3f77d8c5d0b2d17e0c9b28d8346f6beff" }
chumsky = "0.13.0"
ropey = "1.6.1"
tokio = { version = "1.54.1", features = ["fs", "io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = "0.23.0"

[patch.crates-io]
